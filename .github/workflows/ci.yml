name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (main only)
        type: boolean
        default: false
      major:
        description: Major release (otherwise the merged branches decide between minor and patch)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull request runs are replaced by newer pushes; main runs queue so two releases never get the same version.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Compute version
        id: version
        # Bumps the last release tag: MAJOR when ticked, MINOR when a feature/ branch was merged since, otherwise PATCH.
        # Builds that do not release are labelled with the next patch.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          MAJOR: ${{ inputs.major }}
        run: |
          $last = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
          [int[]]$parts = if ($last) { $last.TrimStart('v').Split('.') } else { 0, 0, 0 }
          $bump = 'patch'
          if ($env:RELEASE -eq 'true') {
            $commits = @(if ($last) { git rev-list "$last..HEAD" } else { git rev-list HEAD })
            if (-not $commits) { throw "Nothing was merged since $last." }
            $branches = @($commits | ForEach-Object { gh api "repos/$env:GITHUB_REPOSITORY/commits/$_/pulls" --jq '.[].head.ref' } | Sort-Object -Unique)
            Write-Host "Merged branches since ${last}: $($branches -join ', ')"
            $bump = if ($env:MAJOR -eq 'true') { 'major' } elseif ($branches -like 'feature/*') { 'minor' } else { 'patch' }
          }
          $version = switch ($bump) {
            'major' { "$($parts[0] + 1).0.0" }
            'minor' { "$($parts[0]).$($parts[1] + 1).0" }
            'patch' { "$($parts[0]).$($parts[1]).$($parts[2] + 1)" }
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Build
        run: dotnet build CodeTwin.slnx -c Release "-p:Version=${{ steps.version.outputs.value }}"

      - name: Test
        run: dotnet test CodeTwin.slnx -c Release --no-build

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build setup
        run: installer\Build-Setup.ps1 -Version ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v6
        with:
          name: CodeTwin-Setup-${{ steps.version.outputs.value }}
          path: artifacts/CodeTwin-Setup-*.exe
          retention-days: 14

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          gh release create "v$version" "artifacts\CodeTwin-Setup-$version.exe" --target $env:GITHUB_SHA --title "CodeTwin $version" --generate-notes

      # The runner waits minutes for the build servers dotnet leaves running before it ends the job.
      - name: Stop build servers
        if: always()
        run: dotnet build-server shutdown
